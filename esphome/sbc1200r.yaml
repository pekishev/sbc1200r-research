# ESP8266 DevKit / NodeMCU v2 (ESP-12E, 4 MB flash).
# CJMCU RXI/RXO + TXO/TXI board: use the MOSFET path, Chan1.
# J9.2 TX -> TXO (HV side); TXI (LV side) -> D7/GPIO13.
# J9.1 +5 V -> HV; ESP 3V3 -> LV; J9.3 and ESP GND -> GND.
# J9.4 (presumed controller RX) is not used.
# Power the DevKit from USB or its documented 5 V input initially.
esphome:
  name: sbc1200r
  friendly_name: SBC1200R

esp8266:
  board: nodemcuv2

logger:
  level: INFO
  baud_rate: 0

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
    - ssid: !secret wifi_ssid_home
      password: !secret wifi_password_home
      priority: 0
  power_save_mode: none
  ap:
    ssid: SBC1200R Setup
    password: !secret wifi_password_fallback

captive_portal:

web_server:
  port: 80
  version: 3
  local: true
  log: true

globals:
  - id: mppt_last_frame_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: mppt_seen_frame
    type: bool
    restore_value: false
    initial_value: 'false'

uart:
  id: mppt_uart
  # D7: UART0 RX in swapped mode; serial logging is disabled above.
  rx_pin: GPIO13
  baud_rate: 4800
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256
  debug:
    direction: RX
    dummy_receiver: true
    after:
      bytes: 1
    sequence:
      - lambda: |-
          // Sliding window: recover after noise, a lost byte or a partial frame.
          // FE FE FE FE 07 [Vout LE16] [Iout LE16] [Vin LE16] [sum8]
          static uint8_t frame[12] = {};
          static size_t used = 0;
          for (const uint8_t byte : bytes) {
            if (used == sizeof(frame)) {
              for (size_t i = 1; i < sizeof(frame); ++i)
                frame[i - 1] = frame[i];
              --used;
            }
            frame[used++] = byte;
            if (used != sizeof(frame)) continue;
            if (frame[0] != 0xFE || frame[1] != 0xFE ||
                frame[2] != 0xFE || frame[3] != 0xFE || frame[4] != 7)
              continue;
            uint8_t checksum = 0;
            for (size_t i = 5; i < 11; ++i) checksum += frame[i];
            if (checksum != frame[11]) {
              static uint32_t last_error_ms = 0;
              const uint32_t now = millis();
              if (uint32_t(now - last_error_ms) >= 1000) {
                ESP_LOGW("mppt", "UART checksum mismatch: received %02X, expected %02X",
                         frame[11], checksum);
                last_error_ms = now;
              }
              continue;
            }

            const float vout = (frame[5] | (uint16_t(frame[6]) << 8)) * 0.01f;
            const float iout = (frame[7] | (uint16_t(frame[8]) << 8)) * 0.01f;
            const float vin = (frame[9] | (uint16_t(frame[10]) << 8)) * 0.01f;
            id(mppt_last_frame_ms) = millis();
            id(mppt_seen_frame) = true;
            id(mppt_input_voltage).publish_state(vin);
            id(mppt_output_voltage).publish_state(vout);
            id(mppt_output_current).publish_state(iout);
            id(mppt_output_power).publish_state(vout * iout);
            static uint32_t last_log_ms = 0;
            const uint32_t now = millis();
            if (uint32_t(now - last_log_ms) >= 1000) {
              ESP_LOGI("mppt", "RX FE FE FE FE 07 %02X %02X %02X %02X %02X %02X %02X | Vin=%.2f V Vout=%.2f V Iout=%.2f A Pout=%.1f W",
                       frame[5], frame[6], frame[7], frame[8], frame[9], frame[10], frame[11],
                       vin, vout, iout, vout * iout);
              last_log_ms = now;
            }
          }

sensor:
  - platform: template
    id: mppt_input_voltage
    name: Input Voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    filters:
      - throttle: 1s
      - timeout: 5s

  - platform: template
    id: mppt_output_voltage
    name: Output Voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    filters:
      - throttle: 1s
      - timeout: 5s

  - platform: template
    id: mppt_output_current
    name: Output Current
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    filters:
      - throttle: 1s
      - timeout: 5s

  - platform: template
    id: mppt_output_power
    name: Output Power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle: 1s
      - timeout: 5s

binary_sensor:
  - platform: template
    name: UART Online
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(mppt_seen_frame) &&
             uint32_t(millis() - id(mppt_last_frame_ms)) < 5000;

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (!id(mppt_seen_frame) ||
              uint32_t(millis() - id(mppt_last_frame_ms)) >= 5000) {
            ESP_LOGI("mppt", "Waiting for valid MPPT UART frames on D7/GPIO13 (4800 8N1)");
          }
